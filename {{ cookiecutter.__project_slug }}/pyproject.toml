[project]
name = "{{ cookiecutter.__project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.description }}"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    # 1.0 is a different license grant. Keep generated pipelines below it.
    "kissml>=0.4.15,<1.0",
    "mlflow>=2.17",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "pyarrow>=17.0",
    "pydantic-settings>=2.5",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "tqdm>=4.66",
]

[project.scripts]
run-explore = "pipeline.explore.explore:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "ty>=0.0.1a6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]

[tool.ruff.format]
# Prose docs contain illustrative snippets that are not meant to be reformatted.
exclude = ["*.md"]
